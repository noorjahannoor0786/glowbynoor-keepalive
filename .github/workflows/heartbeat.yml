name: Weekly Heartbeat

on:
  schedule:
    # Har Monday 03:00 UTC (08:30 IST) — repo activity heartbeat.
    # GitHub 60 din ke repo inactivity par scheduled workflows disable kar deta hai.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat commit
        run: |
          date -u "+%Y-%m-%d %H:%M UTC" > HEARTBEAT.md
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEARTBEAT.md
          git diff --cached --quiet || git commit -m "heartbeat: $(date -u '+%Y-%m-%d')"
          git push
